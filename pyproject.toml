# Modified in rea-video-evidence on 2026-11-08; see UPSTREAM.md.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rea-video-evidence"
version = "0.2.0"
description = "Evidence-aware video breakdown, timestamped retrieval and agent review, derived from JuneYaooo/rea-video."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.24,<3",
  "opencv-python-headless>=4.8,<5",
  "Pillow>=9.0",
  "PyYAML>=6.0",
  "onnxruntime>=1.16",   # 人声/配乐分离（UVR MDX-Net，首次运行自动下载约 67 MB 模型）
]

[project.optional-dependencies]
# rapidocr 会顺带装 opencv-python（带 GUI 的那套），和上面的 headless 抢同一个 cv2 目录；
# See README.md for the dedicated-environment headless OpenCV workaround.
ocr = ["rapidocr-onnxruntime>=1.3,<2"]
dev = ["pytest>=7", "jsonschema>=4"]
asr = ["faster-whisper>=1.1,<2"]

[project.urls]
Homepage = "https://github.com/teateatea03/rea-video-evidence"
Source = "https://github.com/teateatea03/rea-video-evidence"
Mirror = "https://gitlab.com/angeltea01/rea-video-evidence"
Upstream = "https://github.com/JuneYaooo/rea-video"

[project.scripts]
rea-video = "rea_video.cli:main"

[tool.setuptools.packages.find]
include = ["rea_video*"]

[tool.setuptools.package-data]
rea_video = ["capabilities/*.yaml", "capabilities/*.json", "capabilities/*.md", "capabilities/models/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
